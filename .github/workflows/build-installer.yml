name: Build Windows installer

# - Pull requests: build + install/run/upgrade/uninstall smoke test (nothing is published)
# - Version tag (git tag v0.4.0 && git push origin v0.4.0): same, then attach the
#   Setup .exe to a GitHub Release. That Release is what the in-app update check finds.
# - Can also be started by hand from the Actions tab.
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Make sure Inno Setup is installed
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Tag matches VERSION in the code
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = (Select-String -Path CMTS_Command_Center.py -Pattern '^VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match VERSION = $v" }

      - name: Build app and installer
        shell: pwsh
        run: ./installer/build_installer.ps1

      - name: Smoke test - install, run, upgrade, uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Get-ChildItem dist/installer/*.exe | Select-Object -First 1).FullName
          $dir   = "$env:ProgramFiles\CMTS Command Center"
          $exe   = "$dir\CMTS_Command_Center.exe"
          $log   = "$env:RUNNER_TEMP\install.log"

          # Wait for Setup itself only. Start-Process -Wait also waits for child processes,
          # which hangs when Setup reopens the app (/RELAUNCH=1).
          function Install([string[]]$extra) {
            $p = Start-Process $setup -ArgumentList (@('/VERYSILENT','/SUPPRESSMSGBOXES','/ALLUSERS','/NORESTART',"/LOG=$log") + $extra) -PassThru
            if (-not $p.WaitForExit(300000)) { Stop-Process -Id $p.Id -Force; Get-Content $log -Tail 60; throw 'Setup timed out' }
            if ($p.ExitCode -ne 0) { Get-Content $log -Tail 60; throw "Setup exit code $($p.ExitCode)" }
            Write-Host "ok  setup exit 0"
          }

          Write-Host '--- fresh install'
          Install @()
          foreach ($f in @($exe, "$dir\unins000.exe", "$dir\LICENSE.txt",
                           "$env:PUBLIC\Desktop\CMTS Command Center.lnk",
                           "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\CMTS Command Center\CMTS Command Center.lnk")) {
            if (-not (Test-Path $f)) { throw "Missing after install: $f" }
            Write-Host "ok  $f"
          }
          Start-Sleep 3
          if (Get-Process CMTS_Command_Center -ErrorAction SilentlyContinue) { throw 'App started after a plain silent install (should only with /RELAUNCH=1)' }

          Write-Host '--- app self-test'
          $report = "$env:RUNNER_TEMP\selftest.json"
          $p = Start-Process $exe -ArgumentList '--selftest', $report -PassThru
          if (-not $p.WaitForExit(120000)) { Stop-Process -Id $p.Id -Force; throw 'Self-test timed out (app likely showed an error dialog)' }
          if (Test-Path $report) { Get-Content $report } else { throw 'Self-test wrote no report' }
          if ($p.ExitCode -ne 0) { throw "Self-test failed (exit $($p.ExitCode))" }

          Write-Host '--- upgrade over existing install, as the in-app updater does'
          Install @('/CLOSEAPPLICATIONS', '/RELAUNCH=1')
          $proc = $null
          foreach ($i in 1..20) { $proc = Get-Process CMTS_Command_Center -ErrorAction SilentlyContinue; if ($proc) { break }; Start-Sleep 1 }
          if (-not $proc) { throw 'App did not reopen after /RELAUNCH=1 upgrade' }
          Write-Host 'ok  app reopened after upgrade'
          $proc | Stop-Process -Force
          Get-Process CMTS_Command_Center -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep 2

          Write-Host '--- uninstall'
          $u = Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru
          [void]$u.WaitForExit(120000)
          foreach ($i in 1..60) { if (-not (Test-Path $exe)) { break }; Start-Sleep 1 }
          if (Test-Path $exe) { throw 'App still present after uninstall' }
          if (Test-Path "$env:PUBLIC\Desktop\CMTS Command Center.lnk") { throw 'Desktop shortcut left after uninstall' }
          Write-Host 'ok  uninstalled cleanly'

      - uses: actions/upload-artifact@v4
        with:
          name: CMTS_Command_Center_Setup
          path: dist/installer/*.exe

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            ${{ runner.temp }}/install.log
            ${{ runner.temp }}/selftest.json
          if-no-files-found: ignore

      - name: Release notes from README ("What's new in <version>")
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          $lines = Get-Content README.md
          $start = [array]::IndexOf($lines, "### What's new in $v")
          $notes = @()
          if ($start -ge 0) {
            for ($i = $start + 1; $i -lt $lines.Count -and -not $lines[$i].StartsWith('#'); $i++) { $notes += $lines[$i] }
          }
          if (-not ($notes -join '').Trim()) { $notes = @("Version $v") }
          $notes += '', '**Install:** download `CMTS_Command_Center_Setup_' + $v + '.exe` below and run it. Existing installs offer this update automatically.'
          Set-Content -Path "$env:RUNNER_TEMP\notes.md" -Value $notes -Encoding utf8

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/installer/*.exe
          body_path: ${{ runner.temp }}/notes.md
