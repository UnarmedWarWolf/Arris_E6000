name: Build Windows installer

# Runs when you push a version tag (e.g. git tag v0.3.2 && git push origin v0.3.2)
# and attaches the Setup .exe to a GitHub Release. Can also be started by hand
# from the Actions tab; then the installer is available as a downloadable artifact.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Make sure Inno Setup is installed
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build app and installer
        shell: pwsh
        run: ./installer/build_installer.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: CMTS_Command_Center_Setup
          path: dist/installer/*.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/installer/*.exe
          generate_release_notes: true
